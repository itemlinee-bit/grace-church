<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>懷恩團隊 各分會主日聚會時間及地址</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #b89775;
            --bg-color: #faf9f6; /* 優雅的溫暖米白 */
            --panel-bg: #ffffff;
            --text-color: #2b303a;
            --text-muted: #888888;
            --border-color: #eae7e2;
            --hover-bg: #fdfdfc;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 60px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 頂級極簡標頭 */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.4rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        header p {
            color: var(--secondary-color);
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* 高級感細線搜尋列 */
        .search-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: none;
            border-bottom: 2px solid var(--border-color);
            background: transparent;
            font-size: 1.05rem;
            color: var(--text-color);
            outline: none;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 400;
        }

        .search-box input:focus {
            border-bottom-color: var(--primary-color);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        /* 現代高端大氣表格 */
        .table-container {
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(44, 62, 80, 0.03);
            overflow: hidden;
            border: 1px solid rgba(230, 225, 218, 0.6);
        }

        .table-header {
            display: grid;
            grid-template-columns: 140px 140px 1fr 100px;
            padding: 20px 30px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
            color: var(--secondary-color);
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .table-body {
            display: flex;
            flex-direction: column;
        }

        .table-row {
            display: grid;
            grid-template-columns: 140px 140px 1fr 100px;
            padding: 24px 30px;
            align-items: center;
            border-bottom: 1px solid rgba(234, 231, 226, 0.5);
            background-color: transparent;
            transition: all 0.25s ease;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row:hover {
            background-color: var(--hover-bg);
            transform: scale(1.005);
            box-shadow: 0 8px 25px rgba(0,0,0,0.015);
        }

        /* 欄位樣式 */
        .cell-church {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .cell-time {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-color);
        }

        .cell-address {
            font-size: 1rem;
            color: #555860;
            padding-right: 20px;
            font-weight: 300;
        }

        /* 極簡精緻按鈕 */
        .cell-action {
            text-align: right;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--secondary-color);
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            background: #ffffff;
        }

        .table-row:hover .btn-link {
            background-color: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* 無結果提示 */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
            display: none;
        }

        /* 響應式：手機板平滑轉換 */
        @media (max-width: 768px) {
            body {
                padding: 40px 15px;
            }
            header h1 { font-size: 1.8rem; }
            
            .table-header {
                display: none; /* 手機板隱藏表頭 */
            }
            
            .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 22px 20px;
                position: relative;
            }
            
            .cell-church {
                font-size: 1.25rem;
                margin-bottom: 2px;
            }
            
            .cell-time::before {
                content: "聚會時間：";
                color: var(--text-muted);
                font-size: 0.9rem;
                font-weight: 400;
            }
            
            .cell-address {
                font-size: 0.95rem;
                margin-top: 2px;
                padding-right: 0;
            }
            
            .cell-action {
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>懷恩團隊各分會聚會表</h1>
        <p>Sunday Service Schedule & Directory</p>
    </header>

    <div class="search-wrapper">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="搜尋分會名稱、時間或地址...">
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <div>分會名稱</div>
            <div>聚會時間</div>
            <div>聚會地址</div>
            <div style="text-align: right;">地圖導航</div>
        </div>
        
        <div class="table-body" id="tableBody">
            </div>
        
        <div class="no-results" id="noResults">
            未找到相符的分會資料
        </div>
    </div>
</div>

<script>
    // 嚴謹完整的一字未漏資料集
    const churchData = [
        { name: "大溪", time: "09:30:00", address: "桃園市大溪區介壽路 1267 巷 55 號" },
        { name: "中壢", time: "09:30:00", address: "桃園市中壢區元化路二段47號6樓" },
        { name: "美地", time: "19:30:00", address: "桃園市平鎮區文心路100號" },
        { name: "楊梅", time: "10:00:00", address: "桃園市楊梅區永美路 395 號 5 樓" },
        { name: "高雄", time: "10:00:00", address: "高雄市左營區明誠二路 480 號 5 樓" },
        { name: "新希望", time: "10:00:00", address: "桃園市中壢區延平路500號2樓" },
        { name: "龍岡", time: "09:00:00", address: "桃園市中壢區龍岡路三段 620 巷 15號" },
        { name: "蘭陽", time: "10:00:00", address: "宜蘭縣三星鄉上將路三段735 號" },
        { name: "生命活泉", time: "10:00:00", address: "台中市北區漢口路三段 1-3 號 4 樓" },
        { name: "埔里", time: "10:00:00", address: "南投縣埔里鎮育溪路66-3號2樓" },
        { name: "龜山", time: "10:00:00", address: "龜山區萬壽路二段 1079 號" },
        { name: "喜信家", time: "09:30:00", address: "桃園市桃園區中正路1059號4樓" },
        { name: "以馬內利", time: "10:00:00", address: "新北市樹林區中正路520號" },
        { name: "愛的教會", time: "10:00:00", address: "台中市豐原區自強街126號" },
        { name: "八德", time: "09:30:00", address: "桃園市八德區仁德二路1號" },
        { name: "台東", time: "09:00:00", address: "台東市中華路四段 131 巷 255 號" },
        { name: "苗栗新希望", time: "10:00:00", address: "苗栗縣苗栗市源林街68號3樓" },
        { name: "宜蘭新希望", time: "10:00:00", address: "宜蘭縣宜蘭市宜中路222號2樓" },
        { name: "葡萄樹", time: "10:00:00", address: "桃園市桃園區大林路20-1號" }
    ];

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function renderRows(query = '') {
        tableBody.innerHTML = '';
        
        const filtered = churchData.filter(church => 
            church.name.includes(query) || 
            church.address.includes(query) || 
            church.time.includes(query)
        );

        if (filtered.length === 0) {
            noResults.style.display = 'block';
            return;
        } else {
            noResults.style.display = 'none';
        }

        filtered.forEach(church => {
            const formattedTime = church.time.substring(0, 5); // 呈現如 09:30 的乾淨感
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(church.name === '新希望' || church.name === '美地' ? '懷恩團隊' + church.name + '教會' : church.address)}`;

            const row = document.createElement('div');
            row.className = 'table-row';
            row.innerHTML = `
                <div class="cell-church">${church.name}</div>
                <div class="cell-time">${formattedTime}</div>
                <div class="cell-address">${church.address}</div>
                <div class="cell-action">
                    <a href="${mapUrl}" target="_blank" class="btn-link" title="開啟 Google 地圖">
                        <i class="fa-solid fa-arrow-right-long"></i>
                    </a>
                </div>
            `;
            tableBody.appendChild(row);
        });
    }

    // 搜尋即時過濾
    searchInput.addEventListener('input', (e) => {
        renderRows(e.target.value.trim());
    });

    // 初始載入
    renderRows();
</script>

</body>
</html>
